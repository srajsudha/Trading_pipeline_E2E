# This is a Declarative Automation Bundle definition for trading_pipeline_e2e.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: trading_pipeline_e2e
  uuid: 6d436cf8-7314-4bab-9cc4-8a5459383e89

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1c079e81-2c76.cloud.databricks.com
    variables:
      catalog: trading_pipeline_e2e
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-1c079e81-2c76.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/sudhanshuraj@deloitte.co.uk to make sure we only have a single copy.
      root_path: /Workspace/Users/sudhanshuraj@deloitte.co.uk/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: trading_pipeline_e2e
      schema: prod
    permissions:
      - user_name: sudhanshuraj@deloitte.co.uk
        level: CAN_MANAGE
