# The main pipeline for trading_pipeline_e2e

resources:
  pipelines:
    trading_pipeline_e2e_etl:
      name: trading_pipeline_e2e_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/trading_pipeline_e2e_etl"

      libraries:
        - glob:
            include: ../src/trading_pipeline_e2e_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
